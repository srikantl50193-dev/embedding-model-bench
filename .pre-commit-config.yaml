repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: ^docs/charts/.*\.svg$  # Generated by scripts/make_charts.py.
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files
  # Ruff and ty run from the project's environment, so their versions follow uv.lock and can't
  # drift from what CI runs.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ty
        name: ty check
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false
